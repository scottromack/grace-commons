\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, and the
\* clock and the leases count down to a fixed point, so no clock bound is set.
\* Re-derived 2026-11-22 (Lease's try_take, Capability requirement 57, the young edge 2D + Cr):
\*   Subs = {a, b}, Cap = 2, D = 2, Cr = 1 -> 20,569,858 states, 210 s on TLC, exhaustive, holds (canonical run)
\*   Subs = {a}                            -> 37,689 states, exhaustive, holds
\*   Subs = {a}, Cap = 3                   -> 55,332 states, exhaustive, holds (bump run)
\*   Subs = {a}, D = 3                     -> 57,716 states, exhaustive, holds (bump run)
\*   Subs = {a}, Cr = 2                    -> 43,407 states, exhaustive, holds (bump run)
\*   (2026-11-09 model: Subs = {a, b} 11,564,902 states; Subs = {a} 20,514.)
\*   Subs = {a, b} passed the old WASM checker's 200,000-state cap (the writers' states multiply
\*   over each pair); TLC takes it. The loop over several subscribers and the gap run's
\*   repeated runs have their own model, preference-aware-notification-fanout-batch.tla.
\* Cap = 2 is the minimal choice that keeps a delivery, a retry of it, and another fanout's
\* delivery from all being admitted; D = 2 lets a lease outlive a tick; Cr = 1 puts the gap
\* leg's lower edge at 2D + Cr + 1 = 6, past a lease taken at the bound's last instant (2D).
