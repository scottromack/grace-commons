# Beacon's deployment (SPEC.md, Running it). The store is XTDB in memory inside the same machine, so the machine needs the room the JVM does.
app = 'beacon-clinical'
primary_region = 'sjc'

[build]

[env]
  PORT = '8000'
  SECURE_COOKIE = '1'

# The earlier render's volume stays mounted and unused: Fly refuses to deploy over a machine whose volume the config drops, and deleting it is Scott's to do.
[[mounts]]
  source = 'beacon_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1   # the store is in memory: a stopped machine is a fresh Beacon, so none is stopped

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    path = '/login'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
