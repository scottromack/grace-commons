title: Grace Commons
description: Software patterns written once in controlled English that people read plainly and machines check. Intent is canonical; tests and code are derived.

url: https://gracecommons.dev

image: /og.webp

# The theme is jtd-inks (Just the Docs on Tailwind and INKs), a gem from GitHub pinned in
# package.json (see Gemfile). The site builds its own stylesheet from the theme's templates and
# its own pages: tailwind.css, built by .github/workflows/pages.yml. Light and dark follow the
# reader's system, so there is no color_scheme.
theme: just-the-docs

author: Scott Romack

plugins:
  - jekyll-include-cache
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# A link written as a file path (`./method.md`, `../atoms/favorite.md#intent`) reads on GitHub and in an editor, and the site
# turns it into the page's address. GitHub's own Pages build did this by default; the workflow that replaced it does not, so
# the plugin is named here. A link to a file the site does not build is left as it was written. Nothing in a page changes.
relative_links:
  enabled: true
  collections: false

# Everything else the theme's templates read (search, the logo, heading anchors, the copy button,
# the GitHub link top right) comes from the theme's own _config.yml: Jekyll reads it beneath this
# one when the theme gem is a checkout. This file holds only what the site changes.
mermaid:
  version: "10.9.1"

# The site's own nav: GitHub is in the top bar, so not again in the sidebar, and the order the
# site has had.
nav_external_links:
  - title: Join Us
    url: https://discord.gg/mpKss4n6ef
    hover: on Discord
nav_sort: case_insensitive

markdown: kramdown

# Derived pattern cards: atoms/ and compositions/ pages get the theme's `pattern` layout
# (which injects its pattern-card.html from _data/patterns.json) via defaults,
# so the canonical pattern files themselves are never edited. Regenerate the data
# with `python3 tools/taxonomy/generate_graph.py .`.
defaults:
  - scope:
      path: "" # all pages (GitHub Pages adds this implicitly; plain Jekyll does not)
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "atoms"
    values:
      layout: "pattern"
  - scope:
      path: "compositions"
    values:
      layout: "pattern"

# What is not the site. This list replaces Jekyll's own default one, so it names the build's files
# too (Gemfile, vendor/, node_modules/). Jekyll's watcher takes it as the paths to ignore: the
# council's folders (.beads writes a log every few seconds, the skill folders under .claude and
# .opencode are links the watcher cannot follow) and the build's own state must not rebuild the site.
exclude:
  - .beads/
  - .beads.gate.lock
  - .claude/
  - .gc/
  - .gemini/
  - .opencode/
  - .pytest_cache/
  - .vscode/
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - build/
  - build-terms/
  - demos/
  - fly.toml
  - grants/
  - internal/
  - node_modules/
  - package.json
  - package-lock.json
  - tailwind.css
  - tools/
  - vendor/
  - working-ideas/
