title: Grace Commons
description: Software patterns written once in controlled English that people read plainly and machines check. Intent is canonical; tests and code are derived.

url: https://gracecommons.dev

image: /og.webp

# The theme is jtd-inks (Just the Docs on Tailwind and INKs), a gem from GitHub pinned in
# package.json (see Gemfile). The site builds its own stylesheet from the theme's templates and
# its own pages: tailwind.css, built by .github/workflows/pages.yml. Light and dark follow the
# reader's system, so there is no color_scheme.
theme: just-the-docs

author: Scott Romack

plugins:
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# A link written as a file path (`./method.md`, `../atoms/favorite.md#intent`) reads on GitHub and in an editor, and the site
# turns it into the page's address. GitHub's own Pages build did this by default; the workflow that replaced it does not, so
# the plugin is named here. A link to a file the site does not build is left as it was written. Nothing in a page changes.
# A pattern's file takes the .idd extension (Scott 2026-11-26), Markdown the site renders as it renders .md.
markdown_ext: "markdown,mkdown,mkdn,mkd,md,idd"

relative_links:
  enabled: true
  collections: false

# Everything else the theme's templates read (search, the logo, heading anchors, the copy button,
# the GitHub link top right) comes from the theme's own _config.yml: Jekyll reads it beneath this
# one when the theme gem is a checkout. This file holds only what the site changes.
mermaid:
  version: "10.9.1"

# The site's own nav: GitHub is in the top bar, so not again in the sidebar, and the order the
# site has had.
nav_external_links:
  - title: Join Us
    url: https://discord.gg/mpKss4n6ef
    hover: on Discord
    hide_icon: true
    opens_in_new_tab: false
nav_sort: case_insensitive

markdown: kramdown

# Derived pattern cards: library/atoms/ and library/compositions/ pages get the theme's `pattern` layout
# (which injects its pattern-card.html from _data/patterns.json) via defaults,
# so the canonical pattern files themselves are never edited. Regenerate the data
# with `python3 tools/taxonomy/generate_graph.py .`.
#
# The menu follows the folders (unit `library: the files match the tree`, Scott 2026-11-23 10:00 PM
# Central): every menu section is a folder, and the folder sets a page's parent here, so no page
# carries a `parent:` line. A section's own page stands at the root beside its folder (corpus.md
# beside library/, evidence.md beside evidence/), since Jekyll's defaults cannot take a parent away
# from one page of a folder; an index inside library/ is set apart by a scope of its own path.
defaults:
  - scope:
      path: "" # all pages (GitHub Pages adds this implicitly; plain Jekyll does not)
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "library/"
    values:
      parent: "The Library"
  - scope:
      path: "library/atoms"
    values:
      layout: "pattern"
      parent: "Atomic Concepts"
  - scope:
      path: "library/atoms/index.md"
    values:
      parent: "The Library"
  - scope:
      path: "library/compositions"
    values:
      layout: "pattern"
      parent: "Conceptual Compositions"
  - scope:
      path: "library/compositions/README.md"
    values:
      parent: "The Library"
  - scope:
      path: "how/"
    values:
      parent: "How Grace Works"
  - scope:
      path: "evidence/"
    values:
      parent: "Evidence"
  - scope:
      path: "community/"
    values:
      parent: "Community"
  - scope:
      path: "log/"
    values:
      parent: "Project Log"

# What is not the site. This list replaces Jekyll's own default one, so it names the build's files
# too (Gemfile, vendor/, node_modules/). Jekyll's watcher takes it as the paths to ignore: the
# council's folders (.beads writes a log every few seconds, the skill folders under .claude and
# .opencode are links the watcher cannot follow) and the build's own state must not rebuild the site.
exclude:
  - .beads/
  - .beads.gate.lock
  - .claude/
  - .gc/
  - .gemini/
  - .opencode/
  - .pytest_cache/
  - .vscode/
  - AGENTS.md
  - CLAUDE.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - build/
  - build-terms/
  - demos/
  - fly.toml
  - grants/
  - internal/
  - node_modules/
  - package.json
  - package-lock.json
  - tailwind.css
  - tools/
  - vendor/
  - working-ideas/

# a file whose name starts with `_` is a helper, which Jekyll skips unless included here
include:
  - library/atoms/_TAXONOMY.md
