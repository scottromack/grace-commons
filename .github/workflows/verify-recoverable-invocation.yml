name: Verify Recoverable Invocation's models

# Recoverable Invocation's model, its twins, its isolations and its probes:
# about 37 minutes of model checking, split from verify.yml because that
# workflow cancels its in-progress run on every push, and at the corpus's
# commit pace a run this long would rarely finish. This one runs when the
# models or the harness change, and weekly, and is never cancelled by a newer
# push: every run reports. tools/harness/recoverable-invocation.pattern names
# the models, for this workflow's --only and verify.yml's --except alike; the
# push paths below are its four prefixes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'compositions/recoverable-invocation*'
      - 'compositions/iso-*'
      - 'compositions/probe-*'
      - 'compositions/reach-*'
      - 'tools/harness/**'
      - '.github/workflows/verify-recoverable-invocation.yml'
  schedule:
    - cron: '0 6 * * 6'   # Saturdays 06:00 UTC, beside verify.yml's rescan

concurrency:
  group: verify-recoverable-invocation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-models:
    name: Formal models — Recoverable Invocation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/harness
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bootstrap checkers (npm-only; JRE 17 to /tmp)
        run: bash bootstrap.sh

      - name: Audit Recoverable Invocation's models — correct hold, twins and probes rejected
        run: node audit.mjs --only "$(cat recoverable-invocation.pattern)"
