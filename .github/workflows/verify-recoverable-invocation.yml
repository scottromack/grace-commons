name: Verify Recoverable Invocation's models

# Recoverable Invocation's model, its twins, its isolations and its probes:
# about 37 minutes of model checking, split from verify.yml because that
# workflow cancels its in-progress run on every push, and at the corpus's
# commit pace a run this long would rarely finish. This one runs when the
# models or the harness change, and weekly, and is never cancelled by a newer
# push: every run reports. tools/harness/recoverable-invocation.pattern names
# the models, for this workflow's --only and verify.yml's --except alike; the
# push paths below are its four prefixes, in compositions/models/.
#
# A run by hand audits only what it reads (unit `tooling: the nightly skips unless what it
# reads changed`, Scott 2026-11-14): the `decide` job compares the commit of the last run
# of this workflow that succeeded with HEAD, by path, over this workflow's own
# `on.push.paths` (.github/scripts/audit-guard.sh reads the list from this file), and when
# no file under them differs the run ends green in seconds and says "nothing the audit
# reads changed since <sha>". In doubt it audits. The Saturday rescan, the weekly run
# that depends on nobody's attention, stays unconditional, and so does a push.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'compositions/models/recoverable-invocation*'
      - 'compositions/models/iso-*'
      - 'compositions/models/probe-*'
      - 'compositions/models/reach-*'
      - 'tools/harness/**'
      - '.github/workflows/verify-recoverable-invocation.yml'
  schedule:
    - cron: '0 6 * * 6'   # Saturdays 06:00 UTC, beside verify.yml's rescan

concurrency:
  group: verify-recoverable-invocation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    name: Is there anything new to audit?
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the last run's commit must be reachable to compare paths

      - name: Compare what the audit reads with the last run that succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          skip=false
          last=$(gh run list --workflow verify-recoverable-invocation.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          verdict=$(bash .github/scripts/audit-guard.sh .github/workflows/verify-recoverable-invocation.yml "$last" "${{ github.sha }}")
          echo "$verdict"
          case "$verdict" in
            skip:*) skip=true; echo "::notice::${verdict#skip: }"; echo "${verdict#skip: }" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  formal-models:
    name: Formal models — Recoverable Invocation
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/harness
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bootstrap checkers (npm-only; JRE 17 to /tmp)
        run: bash bootstrap.sh

      - name: Audit Recoverable Invocation's models — correct hold, twins and probes rejected
        run: node audit.mjs --only "$(cat recoverable-invocation.pattern)"
