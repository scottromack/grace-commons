name: Tooling bug
description: Something in tools/ does not work as it says.
title: "Tooling: "
labels: ["tooling"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The script or command, for example tools/grace/check.py.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran
      description: The command, from the repository root.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
