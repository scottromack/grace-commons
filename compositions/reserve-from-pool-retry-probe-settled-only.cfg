CHECK_DEADLOCK FALSE
CONSTANTS
    Tk = {"t1", "t2", "t3"}
    Ty = {"R", "C"}
    Dg = {"d1", "d2", "d3"}
\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, and the
\* idempotency window is not a number, so no clock bound is set.
\*   Tk = {t1, t2, t3}, Ty = {R, C}, Dg = {d1, d2, d3} -> 262,144 states, 11 s on TLC, exhaustive, holds (canonical run)
\*   Tk = {t1, t2}, Ty = {R, C}, Dg = {d1, d2}   -> 1,849 states, exhaustive, holds (the earlier canonical run)
\*   Tk = {t1}                                    -> 43 states, exhaustive, holds (bump run)
\*   Dg = {d1, d2, d3}                            -> 4,096 states, exhaustive, holds (bump run)
\*   Tk = {t1, t2, t3}                            -> 79,507 states, exhaustive, holds (bump run)
\* Two tokens are the minimum that gives the token results map and the journal two tokens' entries
\* to keep apart; the third token behaves as the second.
