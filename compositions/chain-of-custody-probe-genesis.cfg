SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv7_AuthPrecedence
INVARIANT Transfer_holder_rechecked
INVARIANT Inv1_Attributed
INVARIANT Invariant_4_3
INVARIANT Recovered_names_entry
INVARIANT Owed_outcome
INVARIANT Pairing_unique
INVARIANT Genesis_needs_lookup
INVARIANT Write_ownership_finding
INVARIANT False_closing_alert
INVARIANT Duplicate_detected
INVARIANT Probe_false
CHECK_DEADLOCK FALSE
CONSTANTS
    NC = 1
    NCu = 2
    N = 3
    MaxDirect = 1
\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, under TLC.
\*   NC = 1, NCu = 2, N = 3, MaxDirect = 1  -> 478,490 states, exhaustive, holds
\*                                            (canonical run; about 20 seconds under TLC)
\*   N = 2                                  -> 4,866 states, exhaustive, holds
\*   NCu = 3                                -> 3,355,208 states, exhaustive, holds
\*   MaxDirect = 2                          -> 2,151,338 states, exhaustive, holds
\*   N = 4                                  -> not exhaustive: stopped at the 25-minute cap after
\*                                            31,145,765 states with no violation
\* N = 3 is the fewest invocations that reach a transfer resolved before another's commit beside
\* an origination, and a retried act of one key (-buggy-equal-now, -buggy-payload-pairing).
