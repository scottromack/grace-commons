\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice. The windows meet
\* Capability requirement 10 (W exceeds A + K + R) and 34 (H exceeds W + K + R), and H exceeds the
\* widened window so Invariant 2.1 and 3.5 can fire before the record ages.
\*   W = 9, K = 4, R = 2, A = 2, O = 2, H = 17, FbP = 10, FbG = 4, MaxSeam = 5, MaxPos = 8, T = 22
\*                                   -> 836,593 states, 5 s on TLC, exhaustive, holds (canonical run)
\*   W = 5, K = 2, R = 1, A = 1, O = 1, H = 10, FbP = 4, FbG = 1, MaxSeam = 0, MaxPos = 3, T = 11
\*                                   -> 20,400 states, exhaustive, holds (the earlier canonical run)
\*   MaxSeam = 1                     -> 39,483 states, exhaustive, holds (bump run)
\*   FbP = 5, MaxPos = 4             -> 24,272 states, exhaustive, holds (bump run)
\*   W = 4, K = 1, H = 9, T = 10, FbP = 5
\*                                   -> 16,608 states, exhaustive, holds (bump run)
\* Two records at once (one of each kind) passed the old checker's cap of 200,000 states, so the model
\* takes one record, of either kind, and the reconciliation reads it each run. That size is not one a
\* .cfg sets: the model keeps one record's state in single variables, and two at once is a change to
\* the model, not made here. What a .cfg can raise is the constants, and they are raised to the size
\* above. FbP = 2 is the fewest
\* refusals that keep a compensation refused past the escalation instant at K = 2 and W = 5 (FbP = 1
\* does not reach the late escalation); the canonical run takes 4.
