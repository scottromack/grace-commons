SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Invariant_1_1
INVARIANT Action_13_LapseYieldsRemaining
INVARIANT Invariant_1_1_Once
INVARIANT Probe_foreign_yield
CHECK_DEADLOCK FALSE
CONSTANTS
    Subs = {"a", "b"}
    D = 2
\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice.
\*   Subs = {a, b}      -> 4,233 states, exhaustive, holds (canonical run)
\*   Subs = {a, b, c}   -> 116,369 states, exhaustive, holds (bump run)
\* Two subscribers are the minimum that makes the lapse's "and every subscriber not yet reached"
\* reachable (the held one and one the invocation has not reached); the three-subscriber run
\* confirms a second unreached subscriber behaves as the first.
