\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, under TLC.
\*   NC = 2, Qs = {q1, q2}, N = 3, MaxDirect = 1  -> 5,538,855 states, exhaustive, holds
\*                                                  (canonical run; about 6 minutes on one TLC worker)
\*   N = 2                                        -> 140,285 states, exhaustive, holds
\*   N = 2, Qs = {q1, q2, q3}                     -> 1,852,805 states, exhaustive, holds
\* N = 3 is the fewest invocations that reach two propagation events for one consent id (a grant,
\* its withdrawal and a retried withdrawal): the operator's second event (-probe-operator-second-event)
\* and the second-event twin need it. N = 4 is not run: N = 2 to N = 3 multiplied the states by
\* about forty, and at that rate N = 4 is past the audit's fifteen-minute limit on one worker.
\* A third pair adds no rule a second does not already cross (N = 2 above). NC = 2 holds the
\* re-consent path; MaxDirect = 1 is the one write outside any invocation the leg reads.
