\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, and the
\* hold's window is one boolean, so no clock bound is set.
\*   Rsv = {r1, r2}, Cap = 1   -> 2,101 states, exhaustive, holds (canonical run)
\*   Cap = 2                   -> 3,589 states, exhaustive, holds (bump run)
\*   Rsv = {r1, r2, r3}        -> MaxDepthExceeded (the checker's depth cap of 40, a hard error,
\*                                not a truncation), at Cap = 1 and at Cap = 2.
\* Cap = 1 is the minimal choice that makes the second reservation meet a full pool and then the
\* slot the first one gave back.
