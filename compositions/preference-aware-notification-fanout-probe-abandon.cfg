CHECK_DEADLOCK FALSE
CONSTANTS
    Subs = {"a"}
    Cap = 2
    D = 2
    Cr = 1
\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice, and the
\* clock and the leases count down to a fixed point, so no clock bound is set.
\*   Subs = {a}, Cap = 2, D = 2, Cr = 1   -> 20,514 states, exhaustive, holds (canonical run)
\*   Cap = 3                               -> 30,098 states, exhaustive, holds (bump run)
\*   D = 3                                 -> 32,981 states, exhaustive, holds (bump run)
\*   Cr = 2                                -> 25,637 states, exhaustive, holds (bump run)
\*   Subs = {a, b}                         -> passes the checker's 200,000-state cap (the
\*                                            writers' states multiply over each pair), so
\*                                            the loop over several subscribers is the
\*                                            sibling model preference-aware-notification-
\*                                            fanout-batch.tla.
\* Cap = 2 is the minimal choice that keeps a delivery, a retry of it, and another fanout's
\* delivery from all being admitted; D = 2 with Cr = 1 puts the gap leg's lower edge (3) after
\* a lease taken inside the invocation duration bound (D) has expired.
