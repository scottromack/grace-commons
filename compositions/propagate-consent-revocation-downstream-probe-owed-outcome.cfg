\* Bound saturation (recorded per pressure-testing.md section Formal-model authoring
\* pitfalls): the state space is exhaustively explored at each constant choice.
\*   Cs = {c1, c2}, Qs = {q1, q2}    -> 24,618 states, exhaustive, holds (canonical run)
\*   Qs = {q1, q2, q3}               -> MaxDepthExceeded, the checker's depth cap of 40 (a hard error, not a truncation)
\*   Cs = {c1, c2, c3}               -> MaxDepthExceeded, the checker's depth cap of 40 (a hard error, not a truncation)
\* Registrations are the first consent's (C1), and any consent may be withdrawn. Each action is
\* three to six steps, so a third pair, a third consent or a second history read (two Cs, two Qs,
\* hEv < 2) passes the depth cap; the canonical run is the largest the cap admits.
